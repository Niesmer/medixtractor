# Database Connection
spring.datasource.url=jdbc:sqlite:database/bdpm.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate / JPA Settings
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.sql.init.mode=never

spring.devtools.livereload.enabled=true
spring.devtools.restart.exclude=static/**,public/**

medixtractor.bdpm.default-source-dir=data/bdpm

# Remote BDPM import (downloads from the official government site)
# If enabled, POST /api/imports/bdpm/remote will download the 3 required files into cacheDir then import them.
medixtractor.bdpm.remote.enabled=true
# Optional overrides (defaults point to base-donnees-publique.medicaments.gouv.fr)
# medixtractor.bdpm.remote.specialites-url=...
# medixtractor.bdpm.remote.presentations-url=...
# medixtractor.bdpm.remote.compositions-url=...
medixtractor.bdpm.remote.cache-dir=data/bdpm-cache
medixtractor.bdpm.remote.connect-timeout-seconds=20
medixtractor.bdpm.remote.request-timeout-seconds=120

# INSEE Sirene API Configuration
insee.api.key=927631ab-ed2d-43d8-b631-abed2d43d83f
insee.api.url=https://api.insee.fr/api-sirene/3.11
