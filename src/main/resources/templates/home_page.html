<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Medixtractor - Database Query</title>
  <link href="css/style.css" rel="stylesheet">
</head>

<body>
  <div class="container">
    <header class="header">
      <h1>Medixtractor</h1>
      <p class="subtitle">Search Medicaments Database</p>
    </header>

    <div class="search-panel">
      <h2>Search Filters</h2>
      <form th:action="@{/search}" method="get" class="filter-form">

        <div class="form-group">
          <label for="nom">Medicine Name</label>
          <input type="text" id="nom" name="nom" th:value="${nom}" placeholder="Enter medicine name">
        </div>

        <div class="form-group">
          <label for="forme">Form</label>
          <input type="text" id="forme" name="forme" th:value="${forme}" placeholder="e.g., Tablet, Syrup">
        </div>

        <div class="form-group">
          <label for="voie">Route</label>
          <input type="text" id="voie" name="voie" th:value="${voie}" placeholder="e.g., Oral, Intravenous">
        </div>

        <div class="form-group">
          <label for="laboratoire">Laboratory</label>
          <input type="text" id="laboratoire" name="laboratoire" th:value="${laboratoire}" placeholder="Enter laboratory name">
        </div>

        <div class="form-group">
          <label for="statut">Status</label>
          <input type="text" id="statut" name="statut" th:value="${statut}" placeholder="e.g., Active, Discontinued">
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Search</button>
          <button type="reset" class="btn btn-secondary">Clear</button>
        </div>
      </form>
    </div>

    <div class="results-panel" th:if="${medicaments != null}">
      <h2>Results (<span th:text="${medicaments.size()}">0</span> found)</h2>

      <div th:if="${medicaments.isEmpty()}" class="no-results">
        <p>No medicaments found. Try adjusting your search criteria.</p>
      </div>

      <div th:unless="${medicaments.isEmpty()}" class="table-wrapper">
        <table class="results-table">
          <thead>
            <tr>
              <th>CIS</th>
              <th>Name</th>
              <th>Form</th>
              <th>Route</th>
              <th>Laboratory</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="med : ${medicaments}">
              <td th:text="${med.cis}">-</td>
              <td th:text="${med.nom}">-</td>
              <td th:text="${med.forme}">-</td>
              <td th:text="${med.voie}">-</td>
              <td th:text="${med.laboratoire}">-</td>
              <td th:text="${med.statut}">-</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</body>

</html>
